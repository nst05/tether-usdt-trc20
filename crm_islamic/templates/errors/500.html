{% extends 'base.html' %}
{% block title %}500 — Ошибка сервера{% endblock %}
{% block content %}
<div class="text-center py-5" style="max-width:480px;margin:0 auto">
  <div style="font-size:7rem;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--danger-dark),#f87171);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">500</div>
  <h4 class="mt-2 mb-2">Внутренняя ошибка сервера</h4>
  <p style="color:var(--text-muted)">Произошла непредвиденная ошибка. Пожалуйста, попробуйте снова или обратитесь к администратору.</p>
  <a href="{{ url_for('dashboard') }}" class="btn btn-primary mt-2">
    <i class="bi bi-house me-1"></i>На главную
  </a>
</div>
{% endblock %}
