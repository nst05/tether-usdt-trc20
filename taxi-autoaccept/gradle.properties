org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Обходные пути для каналов, где рубятся загрузки зависимостей.
# Раскомментировать нужное и остановить демон: ./gradlew --stop
#
# 1. Зеркала репозиториев (другое имя хоста, блокировка по имени их не задевает):
#useMirrors=true
#
# 2. Пин TLS 1.2 — помогает, если записи TLS 1.3 приходят битыми
#    («bad_record_mac / Tag mismatch»). Если, наоборот, появляется
#    «Remote host terminated the handshake» — строку убрать, она мешает.
#org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
