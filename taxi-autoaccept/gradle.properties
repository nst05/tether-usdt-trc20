# TLS 1.2 задан намеренно. На каналах с DPI, антивирусом-перехватчиком HTTPS
# или нестабильным VPN записи TLS 1.3 приходят повреждёнными, и загрузка
# зависимостей падает с «(bad_record_mac) Tag mismatch» / AEADBadTagException.
# Если сеть нормальная, две -D можно убрать — на саму сборку они не влияют.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
