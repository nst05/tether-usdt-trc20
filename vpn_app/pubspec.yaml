name: vpn_app
description: VLESS/Xray VPN Client for Android, iOS and Desktop
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # VPN / Xray core integration
  flutter_v2ray: ^1.0.2

  # State management
  provider: ^6.1.2

  # Persistent storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR code scan & generate
  mobile_scanner: ^5.1.0
  qr_flutter: ^4.1.0

  # Utilities
  uuid: ^4.4.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  clipboard: ^0.1.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0

  # UI
  animations: ^2.0.11
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
