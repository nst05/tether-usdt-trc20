[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "webscan"
version = "0.1.0"
description = "Async web vulnerability scanner with a small plugin API (authorized testing only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
webscan = "webscan.cli:main"

[tool.setuptools.packages.find]
include = ["webscan*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
