name: Android (NexonVPN)

on:
  push:
    branches: [ "claude/android-vpn-app-ukt3ef", "main" ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    paths: [ "android/**" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  # ── APK с заглушкой ядра: собирается всегда, для проверки UI/логики ──────────
  build-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build stub debug APK
        run: ./gradlew :app:assembleStubDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NexonVPN-stub-debug
          path: android/app/build/outputs/apk/stub/debug/*.apk

  # ── Полноценный APK: собирает ядро Xray (gomobile) + tun2socks, затем APK ────
  # Best-effort: если сборка ядра не удалась, job падает, но stub-APK уже есть.
  build-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build libv2ray.aar (Xray core via gomobile)
        run: |
          set -e
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite /tmp/xraycore
          cd /tmp/xraycore
          go mod tidy
          # -checklinkname=0 — обход ошибки link: wlynxg/anet invalid reference to net.zoneCache (Go 1.23+)
          gomobile bind -target=android -androidapi 24 \
            -ldflags="-checklinkname=0" \
            -o "$GITHUB_WORKSPACE/android/app/libs/libv2ray.aar" ./
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}

      - name: Build tun2socks (badvpn) for all ABIs
        run: |
          set -e
          NDK="$ANDROID_NDK_ROOT"
          git clone --depth 1 https://github.com/heiher/badvpn /tmp/badvpn
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S /tmp/badvpn -B /tmp/badvpn/build-$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
              -DBUILD_NOTHING_BY_DEFAULT=1 -DBUILD_TUN2SOCKS=1
            cmake --build /tmp/badvpn/build-$ABI --target badvpn-tun2socks -j2
            mkdir -p app/src/main/jniLibs/$ABI
            cp /tmp/badvpn/build-$ABI/tun2socks/badvpn-tun2socks \
               app/src/main/jniLibs/$ABI/libtun2socks.so
          done

      - name: Build full release APK (unsigned)
        run: ./gradlew :app:assembleFullRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexonVPN-full-release
          path: android/app/build/outputs/apk/full/release/*.apk
