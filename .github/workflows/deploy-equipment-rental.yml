name: Deploy equipment-rental to GitHub Pages

on:
  push:
    branches: [claude/equipment-rental-site-iI1tD]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: equipment-rental/package-lock.json

      - name: Install dependencies
        working-directory: equipment-rental
        run: npm ci

      - name: Build
        working-directory: equipment-rental
        run: npm run build

      - name: Copy index.html as 404.html for SPA routing
        working-directory: equipment-rental
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: equipment-rental/dist
          publish_branch: gh-pages
