name: Deploy equipment-rental to GitHub Pages

on:
  push:
    branches: [claude/equipment-rental-site-iI1tD]
    paths:
      - 'equipment-rental/**'
      - '.github/workflows/deploy-equipment-rental.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: equipment-rental/package-lock.json

      - name: Install dependencies
        working-directory: equipment-rental
        run: npm ci

      - name: Build
        working-directory: equipment-rental
        run: npm run build

      - name: Copy index.html as 404.html for SPA routing
        working-directory: equipment-rental
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: equipment-rental/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
